services:
  - type: web
    name: poshanscan-minor-project-ml
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free

  - type: web
    name: poshanscan-minor-project
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
